name: probe-crimelog
on:
  push:
    branches: [claude/campus-rape-cases-database-eqvpw9]
    paths: [.github/workflows/probe-crimelog.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null 2>&1
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"
          with sync_playwright() as p:
              b=p.chromium.launch(); pg=b.new_page(user_agent=UA)
              pg.goto("https://www.police.psu.edu/daily-crime-log", wait_until="domcontentloaded", timeout=60000)
              pg.wait_for_function("document.body.innerText.includes('INCIDENT #')", timeout=30000)
              print("forms:", pg.eval_on_selector_all("form", "fs=>fs.map(f=>[f.action,f.method,[...f.elements].map(e=>e.name+'='+e.type+'='+e.value)])"))
              print("incidents on first page:", pg.inner_text("body").count("INCIDENT #"))
              pager=pg.eval_on_selector_all("a", "els=>els.filter(e=>/page=/.test(e.href)).map(e=>[e.innerText.trim(),e.href])")
              print("pager:", pager)
              last=[h for t,h in pager if 'last' in t.lower() or '»' in t]
              print("last:", last)
              for url in ["https://www.police.psu.edu/daily-crime-log?page=1","https://www.police.psu.edu/daily-crime-log?page=8"]:
                  pg.goto(url, wait_until="domcontentloaded", timeout=60000)
                  try: pg.wait_for_function("document.body.innerText.includes('INCIDENT #')", timeout=20000)
                  except Exception as e: print("no marker", url)
                  t=pg.inner_text("body"); print(url, "incidents:", t.count("INCIDENT #"), "first:", t[t.find('INCIDENT #'):t.find('INCIDENT #')+60].replace('\n',' '))
              pg.goto("https://www.police.psu.edu/daily-crime-log", wait_until="domcontentloaded", timeout=60000)
              pg.wait_for_function("document.body.innerText.includes('INCIDENT #')", timeout=30000)
              pg.select_option("select", "2")
              btn=pg.query_selector("form input[type=submit], form button")
              if btn: btn.click()
              pg.wait_for_timeout(6000)
              t=pg.inner_text("body"); print("after campus=2 url:", pg.url, "incidents:", t.count("INCIDENT #"))
              b.close()
          PY
