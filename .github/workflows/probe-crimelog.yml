name: probe-crimelog
on:
  push:
    branches: [claude/campus-rape-cases-database-eqvpw9]
    paths: [.github/workflows/probe-crimelog.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          head -c 1500 <(curl -sSL -A "Mozilla/5.0" "https://www.police.psu.edu/daily-crime-log"); echo
          pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null 2>&1
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b=p.chromium.launch(); pg=b.new_page(user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36")
              pg.goto("https://www.police.psu.edu/daily-crime-log", wait_until="networkidle", timeout=60000)
              pg.wait_for_timeout(4000)
              h=pg.content(); print("rendered", len(h))
              t=pg.inner_text("body"); print(t[:4000])
              print("----- links with page=", [a for a in pg.eval_on_selector_all("a", "els=>els.map(e=>e.href)") if "page=" in a][:10])
              print("----- selects", pg.eval_on_selector_all("select", "els=>els.map(e=>[e.name,[...e.options].slice(0,30).map(o=>o.value+':'+o.text)])"))
              print("----- tables", pg.eval_on_selector_all("table", "els=>els.map(e=>e.rows.length)"))
              b.close()
          PY
