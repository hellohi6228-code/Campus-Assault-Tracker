name: Build Clery data
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 1 * *"   # monthly; picks up new federal releases
  push:
    paths: [scripts/build_clery.py, .github/workflows/build-clery.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas xlrd openpyxl
      - run: python scripts/build_clery.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898208+github-actions[bot]@users.noreply.github.com"
          git add data/clery.js
          git diff --cached --quiet && exit 0
          git commit -m "Update Clery Act campus data"
          git push
