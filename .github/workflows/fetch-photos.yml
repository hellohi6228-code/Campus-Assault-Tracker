name: Fetch photos
on:
  workflow_dispatch:
  push:
    paths: [scripts/fetch_photos.py, data/cases.js, data/official-photos.json, .github/workflows/fetch-photos.yml]
permissions:
  contents: write
concurrency: { group: photos, cancel-in-progress: false }
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/fetch_photos.py
      - name: Commit photo list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898208+github-actions[bot]@users.noreply.github.com"
          git add data/photos.js; if [ -d data/photos ]; then git add data/photos; fi
          git diff --cached --quiet && exit 0
          git commit -m "Update photos of convicted individuals"
          git pull --rebase
          git push
