<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Assault Tracker</title>
  <meta name="description" content="Every sex offense reported by US colleges under the Clery Act, mapped and ranked by campus, with documented lawsuits and investigations.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="wrap">
    <h1>Campus Assault Tracker</h1>
    <p class="lede" id="lede">Sex offenses reported by every US college to the federal government.</p>
    <div class="big" id="big"></div>

    <div id="map" role="img" aria-label="Map of reported campus sex offenses"></div>

    <div class="controls">
      <input type="search" id="q" placeholder="Search any university, city, state or case…" aria-label="Search schools" autocomplete="off">
      <div class="toggle" role="group" aria-label="View">
        <button type="button" data-view="schools" class="on">All reports by university</button>
        <button type="button" data-view="cases">Court &amp; lawsuit records</button>
      </div>
    </div>
    <details class="process" id="process"><summary>How a sexual assault case moves through the legal system</summary><div id="process-body"></div></details>
    <p class="count" id="count"></p>

    <div class="table-wrap"><table class="rank" id="rank"></table></div>
    <button type="button" id="more" class="more">Show more</button>

    <section class="news" aria-labelledby="news-h">
      <h2 id="news-h">Latest news</h2>
      <p class="muted small" id="news-meta"></p>
      <ul id="news"></ul>
      <button type="button" id="news-more" class="more">Show more news</button>
    </section>
  </main>

  <footer class="wrap footer" id="footer"></footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <script src="data/us-states.js"></script>
  <script src="data/clery.js"></script>
  <script src="data/process.js"></script>
  <script src="data/cases.js"></script>
  <script src="data/news.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
