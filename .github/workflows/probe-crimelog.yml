name: probe-crimelog
on:
  push:
    branches: [claude/campus-rape-cases-database-eqvpw9]
    paths: [.github/workflows/probe-crimelog.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "== curl bu"; curl -sSL -A "Mozilla/5.0" "https://www.police.psu.edu/daily-crime-log-bu?title=All&page=1" | head -c 600; echo
          pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null 2>&1
          python3 - <<'PY'
          import re
          from playwright.sync_api import sync_playwright
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"
          def first(t):
              i=t.find('INCIDENT #'); return t[i:i+22].replace('\n',' ')
          with sync_playwright() as p:
              b=p.chromium.launch(); pg=b.new_page(user_agent=UA)
              pg.goto("https://www.police.psu.edu/daily-crime-log", wait_until="domcontentloaded", timeout=60000)
              pg.wait_for_function("document.body.innerText.includes('INCIDENT #')", timeout=30000)
              print("p0", pg.url, first(pg.inner_text("body")))
              for k in range(3):
                  prev=first(pg.inner_text("body"))
                  pg.click("a[title*='next' i], a[rel=next], li.pager__item--next a")
                  try: pg.wait_for_function(f"document.body.innerText.indexOf('INCIDENT #')>=0 && !document.body.innerText.includes({prev!r}.slice(0,22))", timeout=20000)
                  except Exception as e: print("wait fail", e.__class__.__name__)
                  t=pg.inner_text("body"); print("next", k, pg.url, t.count('INCIDENT #'), first(t))
              pg.click("li.pager__item--last a, a[title*='last' i]")
              pg.wait_for_timeout(8000)
              t=pg.inner_text("body"); ds=re.findall(r'\d\d/\d\d/\d{4}', t); print("last", pg.url, t.count('INCIDENT #'), ds[-3:] if ds else None)
              pg.goto("https://www.police.psu.edu/daily-crime-log-bu?title=1&page=3", wait_until="domcontentloaded", timeout=60000)
              pg.wait_for_timeout(8000); t=pg.inner_text("body"); print("bu direct", t.count('INCIDENT #'), first(t), len(t))
              b.close()
          PY
