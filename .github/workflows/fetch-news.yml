name: Fetch news
on:
  workflow_dispatch:
  schedule:
    - cron: "41 */6 * * *"   # every 6 hours
  push:
    paths: [scripts/fetch_news.py, scripts/build_search_index.py, .github/workflows/fetch-news.yml]
permissions:
  contents: write
concurrency: { group: data-commit, cancel-in-progress: false }
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/fetch_news.py
      - name: Commit updated news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898208+github-actions[bot]@users.noreply.github.com"
          git add data/news.js
          git diff --cached --quiet && exit 0
          # Rebuild the New finds box and search index on top of the latest branch, then commit together.
          git stash
          git pull --rebase
          git stash pop
          python scripts/build_search_index.py
          git add data/news.js data/new-finds.json data/search-index.json
          git commit -m "Update news feed"
          git push
