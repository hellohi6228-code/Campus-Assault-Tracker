name: probe-clery
on:
  push:
    branches: [claude/campus-rape-cases-database-eqvpw9]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSL -A "Mozilla/5.0" https://ope.ed.gov/campussafety/public/js/app.min.7fc9908f.js -o f.js
          grep -oE "[\"'][^\"']{0,80}(api|Api|API|File|file|\.ashx|\.aspx|/data)[^\"']{0,80}[\"']" f.js | sort -u | head -150
          echo ======
          grep -oE ".{200}Download Data File.{300}" f.js | head -3
          echo ======
          grep -oE ".{150}download\.bin.{150}" f.js | head -3
