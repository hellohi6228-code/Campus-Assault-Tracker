<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Assault Tracker</title>
  <meta name="description" content="Every sex offense reported by US colleges under the Clery Act, mapped and ranked by campus, with documented lawsuits and investigations.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="wrap">
    <h1>Campus Assault Tracker</h1>
    <p class="lede" id="lede">Sex offenses reported by every US college to the federal government.</p>

    <div id="map" role="img" aria-label="Map of reported campus sex offenses"></div>

    <div class="controls">
      <input type="search" id="q" placeholder="Search any school, city or state…" aria-label="Search schools" autocomplete="off">
      <div class="toggle" role="group" aria-label="Rank by">
        <button type="button" data-sort="total" class="on">Most reports</button>
        <button type="button" data-sort="rate">Per 10k students</button>
      </div>
    </div>
    <p class="count" id="count"></p>

    <div class="table-wrap"><table class="rank" id="rank"></table></div>
    <button type="button" id="more" class="more">Show more</button>
  </main>

  <footer class="wrap footer" id="footer"></footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <script src="data/us-states.js"></script>
  <script src="data/clery.js"></script>
  <script src="data/cases.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
