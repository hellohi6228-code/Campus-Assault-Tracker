name: Fetch crime logs
on:
  workflow_dispatch:
  schedule:
    - cron: "11 */3 * * *"   # every 3 hours: we read only the newest page of each log
  push:
    paths: [scripts/fetch_crime_logs.py, .github/workflows/fetch-crime-logs.yml]
permissions:
  contents: write
concurrency: { group: crime-logs, cancel-in-progress: false }
jobs:
  crime-logs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python scripts/fetch_crime_logs.py
      - name: Commit updated crime logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898208+github-actions[bot]@users.noreply.github.com"
          git add data/crimelog
          git diff --cached --quiet && exit 0
          # Other jobs also rewrite the search index, so rebuild it on top of the latest branch before committing.
          git stash
          git pull --rebase
          git stash pop
          python scripts/build_search_index.py
          git add data/crimelog data/search-index.json data/new-finds.json
          git commit -m "Update crime log entries"
          git push
